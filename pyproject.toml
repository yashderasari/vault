[project]
name = "mcp-file-server"
version = "0.1.0"
description = "MCP server for downloading, saving, and managing local files from any AI client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27",
    "httpx>=0.27",
]

[project.scripts]
mcp-file-server = "server:main"

[tool.setuptools]
py-modules = ["server"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
