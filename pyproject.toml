[project]
name = "ai-vault-mcp"
version = "0.1.9"
description = "MCP server that gives AI clients direct access to your local filesystem — save, find, and organize files using natural language"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yash Derasari", email = "ydmisc2803@gmail.com" }]
keywords = ["mcp", "claude", "filesystem", "ai-tools", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "mcp[cli]>=1.27",
    "httpx>=0.27",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/yashderasari/vault"
Repository = "https://github.com/yashderasari/vault"
Issues = "https://github.com/yashderasari/vault/issues"

[project.scripts]
ai-vault-mcp = "server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "pytest-anyio>=0.0.0",
]

[tool.pytest.ini_options]
anyio_mode = "auto"

[tool.setuptools]
py-modules = ["server"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
]
