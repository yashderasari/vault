[project]
name = "mcp-file-server"
version = "0.1.0"
description = "MCP server for downloading, saving, and managing local files from any AI client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27",
    "httpx>=0.27",
]

[project.scripts]
mcp-file-server = "server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "pytest-anyio>=0.0.0",
]

[tool.pytest.ini_options]
anyio_mode = "auto"

[tool.setuptools]
py-modules = ["server"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
]
